name: Build ZeroTier for Xiaomi AX3000T

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: zerotier-ax3000t-build
  cancel-in-progress: true

env:
  LEDE_REPO: coolsnowwolf/lede
  # Last LEDE commit with kernel 6.1.124 (matches LEDE R25.1.1 / AX3000T).
  LEDE_COMMIT: f4a80a4ce1a67f20390131925503358df410b01f
  # Feed revisions from the same period, so the build is reproducible.
  PACKAGES_COMMIT: 170c1be0d63bb93164e285834aa82a9e4c55f988
  LUCI_COMMIT: 8a84f77674561ae79c4f6a83d9488b0b6c35c422

jobs:
  build:
    name: Build ipk and sysupgrade image
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev libelf-dev python3 \
            python3-distutils python3-setuptools rsync swig unzip zlib1g-dev \
            file wget

      - name: Download LEDE source at pinned commit
        run: |
          curl -fL --retry 3 --retry-delay 5 \
            -o lede.tar.gz \
            "https://github.com/${LEDE_REPO}/archive/${LEDE_COMMIT}.tar.gz"
          mkdir -p lede
          tar -xzf lede.tar.gz -C lede --strip-components=1
          rm -f lede.tar.gz

          test -f lede/Makefile
          grep -q 'LINUX_VERSION-6.1 = .124' lede/include/kernel-6.1
          echo "LEDE kernel: $(grep 'LINUX_VERSION-6.1' lede/include/kernel-6.1)"

      - name: Update feeds and drop feed copies of our packages
        run: |
          cd lede
          cat > feeds.conf <<EOF
          src-git packages https://github.com/coolsnowwolf/packages.git^${PACKAGES_COMMIT}
          src-git luci https://github.com/coolsnowwolf/luci.git^${LUCI_COMMIT}
          EOF
          cat feeds.conf

          ./scripts/feeds update -a

          # The feeds still carry an old zerotier (1.14.2) and an incompatible
          # luci-app-zerotier.  Remove both so the local versions are used.
          rm -rf feeds/packages/net/zerotier
          rm -rf feeds/luci/applications/luci-app-zerotier
          ./scripts/feeds update -i

      - name: Add local packages
        run: |
          cd lede
          cp -a "$GITHUB_WORKSPACE/package/zerotier" package/
          cp -a "$GITHUB_WORKSPACE/package/luci-app-zerotier" package/
          ./scripts/feeds install -a

          if find package/feeds -maxdepth 5 \
              \( -name zerotier -o -name luci-app-zerotier \) \
              -print -quit | grep -q .; then
            echo "ERROR: a feed package would shadow the local package"
            find package/feeds -maxdepth 5 \
              \( -name zerotier -o -name luci-app-zerotier \)
            exit 1
          fi

      - name: Configure firmware
        run: |
          cd lede
          rm -f .config
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t=y
          CONFIG_PACKAGE_zerotier=y
          CONFIG_PACKAGE_luci-app-zerotier=y
          CONFIG_PACKAGE_kmod-tun=y
          EOF
          make defconfig

          for sym in \
            CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t \
            CONFIG_PACKAGE_zerotier \
            CONFIG_PACKAGE_luci-app-zerotier \
            CONFIG_PACKAGE_kmod-tun; do
            if ! grep -q "^${sym}=y" .config; then
              echo "ERROR: ${sym} is not enabled after defconfig"
              exit 1
            fi
          done

          grep -E '^(CONFIG_TARGET_mediatek|CONFIG_TARGET_mediatek_filogic|CONFIG_PACKAGE_(zerotier|luci-app-zerotier|kmod-tun))=' .config

      - name: Build firmware and packages
        run: |
          cd lede
          set +e
          make -j"$(nproc)" > build.log 2>&1
          rc=$?
          set -e
          tail -n 200 build.log
          exit $rc

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: lede/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Collect artifacts
        run: |
          set -x
          cd lede
          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          echo "=== built ipk files ==="
          find bin -type f -name '*.ipk' -printf '%p\n' | sort
          echo "=== target images ==="
          find bin/targets -type f -name '*sysupgrade*' -printf '%p\n' | sort

          find bin -type f -name '*.ipk' -exec cp -v {} "$GITHUB_WORKSPACE/artifacts/" \;
          find bin/targets/mediatek/filogic -maxdepth 1 -type f \
            -name '*sysupgrade*' \
            -exec cp -v {} "$GITHUB_WORKSPACE/artifacts/" \;

          for pat in 'zerotier_*.ipk' 'luci-app-zerotier_*.ipk' 'kmod-tun_*.ipk'; do
            if ! ls "$GITHUB_WORKSPACE/artifacts"/$pat >/dev/null 2>&1; then
              echo "ERROR: missing artifact ${pat}"
              exit 1
            fi
          done

          ls -lh "$GITHUB_WORKSPACE/artifacts"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zerotier-ax3000t-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## ZeroTier AX3000T build"
            echo ""
            echo "- LEDE: \`${LEDE_COMMIT}\`"
            echo "- Target: \`mediatek/filogic\` / \`xiaomi_mi-router-ax3000t\`"
            echo ""
            echo "### Artifacts"
            echo '```'
            ls -lh "$GITHUB_WORKSPACE/artifacts" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
